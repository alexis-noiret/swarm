services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_root_password
      - db_app_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any

  php:
    image: localhost:5000/php-app:1.0
    secrets:
      - db_app_password
    volumes:
      - www:/var/www/html
    networks:
      - backend
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - www:/var/www/html:ro
    networks:
      - backend
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any

configs:
  nginx_conf:
    file: ./nginx/default.conf

secrets:
  db_root_password:
    external: true
  db_app_password:
    external: true

networks:
  backend:
    driver: overlay

volumes:
  db_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.109.20,rw,nfsvers=4"
      device: ":/srv/nfs/mariadb"
  www:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.109.20,rw,nfsvers=4"
      device: ":/srv/nfs/www"
